name: flutter_boilerplate
description: "Flutter boilerplate: clean architecture (data + features), bloc, get_it/injectable, dio/retrofit, auto_route, slang."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  material_ui: ^1.11.1
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  dio: ^5.11.1
  retrofit: ^4.10.0
  envied: ^1.3.10
  auto_route: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  retrofit_generator: ^10.3.3
  envied_generator: ^1.3.10
  auto_route_generator: ^10.6.0
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  flutter_gen_runner: ^5.13.0+1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# flutter_gen writes typed accessors to lib/src/shared/assets/ on `make generate`:
#   assets.gen.dart  Assets.images.x / Assets.icons.x (from the assets: list above)
#   fonts.gen.dart   FontFamily.poppins (from the fonts: list above)
#   colors.gen.dart  ColorName.x (from assets/colors/colors.xml)
flutter_gen:
  output: lib/src/shared/assets/
  line_length: 80
  colors:
    inputs:
      - assets/colors/colors.xml

# Launcher icons, written into android/ and ios/ by `make icons`.
icons_launcher:
  image_path: assets/app_icon/app_icon.png # 1024x1024, no transparency (iOS, older Android)
  platforms:
    android:
      enable: true
      adaptive_foreground_image: assets/app_icon/app_icon_foreground.png # transparent; logo inside the center 61%
      adaptive_background_image: assets/app_icon/app_icon_background.png
    ios:
      enable: true
